<div class="quick-filters">
  <button 
    class="chip" 
    [class.active]="activeFilter === 'all'"
    (click)="setFilter('all')">
    All Categories <span class="badge" [class.badge-active]="activeFilter === 'all'">24</span>
  </button>
  
  <button 
    class="chip" 
    [class.active]="activeFilter === 'active'"
    (click)="setFilter('active')">
    Active <span class="badge badge-success" [class.badge-active]="activeFilter === 'active'">20</span>
  </button>
  
  <button 
    class="chip" 
    [class.active]="activeFilter === 'inactive'"
    (click)="setFilter('inactive')">
    Inactive <span class="badge badge-danger" [class.badge-active]="activeFilter === 'inactive'">4</span>
  </button>
</div>
