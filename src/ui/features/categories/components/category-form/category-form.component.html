<div class="form-card">
  <div class="form-header">
    <h2>{{ title }}</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    
    <div class="form-group">
      <label for="categoryName">Category Name <span class="required">*</span></label>
      <input type="text" 
             id="categoryName" 
             formControlName="name" 
             placeholder="e.g. Beverages"
             [class.invalid]="form.get('name')?.invalid && form.get('name')?.touched" />
      <div class="error-message" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
        Category name is required
      </div>
    </div>

    <div class="form-group">
      <label for="categoryStatus">Status</label>
      <div class="select-wrapper">
        <select id="categoryStatus" formControlName="status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
        <span class="material-symbols-rounded">expand_more</span>
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="form.invalid">{{ submitLabel }}</button>
    </div>
    
  </form>
</div>
