<div class="actions-container">
  <button class="action-btn edit-btn" (click)="onEdit($event)" aria-label="Edit Category" title="Edit Category">
    <span class="material-symbols-rounded">edit</span>
  </button>
  <button class="action-btn delete-btn" (click)="onDelete($event)" aria-label="Delete Category" title="Delete Category">
    <span class="material-symbols-rounded">delete_outline</span>
  </button>
</div>
