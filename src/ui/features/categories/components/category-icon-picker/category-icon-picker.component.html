<div class="icon-picker-overlay" (click)="closePicker()"></div>
<div class="icon-picker-panel">
  <div class="picker-header">
    <div class="search-box">
      <span class="material-symbols-rounded search-icon">search</span>
      <input type="text" placeholder="Search icons..." [value]="searchQuery" (input)="onSearch($event)" />
    </div>
    <button class="btn-close" (click)="closePicker()" aria-label="Close Icon Picker">
      <span class="material-symbols-rounded">close</span>
    </button>
  </div>
  
  <div class="picker-body">
    <div class="icon-grid">
      <button 
        *ngFor="let icon of filteredIcons" 
        class="icon-btn" 
        [class.selected]="icon === selectedIcon"
        (click)="selectIcon(icon)"
        [attr.aria-label]="'Select ' + icon + ' icon'"
        type="button">
        <span class="material-symbols-rounded">{{ icon }}</span>
      </button>
    </div>
    
    <div class="empty-state" *ngIf="filteredIcons.length === 0">
      <p>No icons found.</p>
    </div>
  </div>
</div>
