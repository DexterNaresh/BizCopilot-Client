<div class="categories-layout">
  <!-- Main Content Area -->
  <main class="main-content">
    <app-categories-header (addCategory)="onAddCategory()"></app-categories-header>
    
    <app-category-search 
      (search)="onSearch($event)" 
      (filter)="onOpenFilters()">
    </app-category-search>
    
    <app-categories-filter 
      [activeFilter]="activeFilter"
      [totalCount]="totalCategoriesCount"
      [activeCount]="activeCategoriesCount"
      [inactiveCount]="inactiveCategoriesCount"
      (filterChange)="onFilterChange($event)">
    </app-categories-filter>
    
    <app-category-view-toggle
      [totalCount]="totalCategories"
      [viewMode]="viewMode"
      (viewModeChange)="onViewModeChange($event)">
    </app-category-view-toggle>

    <div class="category-content-area">
      <app-category-grid 
        *ngIf="viewMode === 'grid'"
        [categories]="paginatedCategories"
        (edit)="onEditCategory($event)"
        (delete)="onDeleteCategory($event)"
        (toggleStatus)="onToggleStatus($event)">
      </app-category-grid>
      
      <app-category-table 
        *ngIf="viewMode === 'table'"
        [categories]="paginatedCategories"
        (edit)="onEditCategory($event)"
        (delete)="onDeleteCategory($event)"
        (toggleStatus)="onToggleStatus($event)">
      </app-category-table>
    </div>

    <!-- Advanced Pagination -->
    <biz-pagination 
      [totalItems]="totalCategories"
      [pageSize]="pageSize"
      [currentPage]="currentPage"
      [pageSizeOptions]="[8, 10, 12, 20, 25, 50]"
      itemName="categories"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)">
    </biz-pagination>
  </main>

  <!-- Right Contextual Panel (Desktop Only) -->
  <aside class="right-rail">
    <app-category-support-panel [categories]="allCategories"></app-category-support-panel>
  </aside>

  <!-- Overlays -->
  <app-add-category-modal 
    *ngIf="showAddCategoryModal"
    [editCategory]="selectedCategoryForEdit"
    (close)="closeModals()"
    (save)="onSaveCategory($event)">
  </app-add-category-modal>

  <biz-filter-sheet *ngIf="showFiltersSheet" title="Category Filters" (closeSheet)="closeModals()">
    <app-categories-filter 
      [activeFilter]="activeFilter"
      [totalCount]="totalCategoriesCount"
      [activeCount]="activeCategoriesCount"
      [inactiveCount]="inactiveCategoriesCount"
      (filterChange)="onFilterChange($event); closeModals()">
    </app-categories-filter>
  </biz-filter-sheet>
</div>
