<button class="fingerprint-btn" (click)="useFingerprint()">
  <div class="icon-wrapper">
    <!-- Using check_circle or store placeholder since we don't have fingerprint SVG, 
         in real app would be fingerprint icon -->
    <img src="assets/icons/startup/lock.svg" alt="Fingerprint" />
  </div>
  <div class="text-content">
    <h3>Use Fingerprint</h3>
    <p>Login quickly using your device fingerprint.</p>
  </div>
  <div class="chevron">
    <img src="assets/icons/startup/arrow_forward.svg" alt="Go" />
  </div>
</button>
