<div class="login-layout">
  <!-- Global Header (Desktop/Tablet & Mobile shared structure) -->
  <header class="login-header">
    <div class="brand">
      <div class="brand-icon">
        <img src="assets/icons/startup/lock.svg" alt="BizCopilot" />
      </div>
      <span class="brand-text">BizCopilot</span>
    </div>
    <button class="help-button">
      <img src="assets/icons/startup/help.svg" alt="Help" />
      <span>Help</span>
    </button>
  </header>

  <!-- Security Hero & Welcome Section -->
  <div class="hero-section">
    <div class="security-hero">
      <div class="hero-circle">
        <img src="assets/icons/startup/lock.svg" alt="Secure Login" />
      </div>
      <!-- Add particles if needed -->
    </div>
    <h1 class="welcome-title">Welcome back!</h1>
    <p class="welcome-subtitle">Enter your PIN to access BizCopilot.</p>
  </div>

  <!-- Login Card Container -->
  <div class="login-card-container">
    <app-login-card></app-login-card>
  </div>

  <!-- Security Footer -->
  <div class="security-footer">
    <img src="assets/icons/startup/shield.svg" alt="Secure" />
    <span>Your data is 100% secure and private.</span>
  </div>
</div>
