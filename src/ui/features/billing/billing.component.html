<div class="billing-layout">
  
  <!-- Left Side: Catalog -->
  <div class="catalog-section">
    <app-billing-header 
      [heldBillsCount]="(heldBills$ | async)?.length || 0"
      (openHeldBills)="onOpenHeldBills()"
      (openRecentBills)="onPlaceholderAction('Recent Bills List')">
    </app-billing-header>
    
    <app-billing-search 
      (search)="onSearch($event)"
      (scan)="onPlaceholderAction('Scan Barcode')">
    </app-billing-search>
    
    <app-billing-filter 
      [categories]="categories"
      [activeFilter]="activeFilter"
      (filterChange)="onFilterChange($event)">
    </app-billing-filter>
    
    <div class="grid-scroll-area">
      <app-billing-product-grid 
        [products]="filteredProducts"
        [cartItems]="(cartItems$ | async) || []"
        (addProduct)="onAddProduct($event)"
        (updateQuantity)="onUpdateQuantity($event)"
        (toggleFavourite)="onToggleFavourite($event)">
      </app-billing-product-grid>
    </div>
  </div>

  <!-- Right Side: Desktop Cart Panel -->
  <div class="desktop-cart-section">
    <app-billing-cart-panel
      [cartItems]="(cartItems$ | async) || []"
      [itemCount]="(itemCount$ | async) || 0"
      [subtotal]="(subtotal$ | async) || 0"
      [discount]="(discount$ | async) || 0"
      [total]="(total$ | async) || 0"
      [appliedOffer]="currentAppliedOffer"
      [customer]="(customer$ | async)"
      (updateQuantity)="onUpdateQuantity($event)"
      (remove)="onRemoveCartItem($event)"
      (clearCart)="onClearCart()"
      (openCustomer)="onOpenCustomer()"
      (openOffers)="onOpenOffers()"
      (holdBill)="onHoldBill()"
      (proceedToPay)="onProceedToPay()">
    </app-billing-cart-panel>
  </div>

  <!-- Mobile Cart Elements -->
  
  <!-- Sticky Bottom Bar -->
  <app-billing-mobile-cart-bar
    *ngIf="!isMobileCartOpen"
    [itemCount]="(itemCount$ | async) || 0"
    [total]="(total$ | async) || 0"
    [discount]="(discount$ | async) || 0"
    (openCart)="isMobileCartOpen = true"
    (holdBill)="onHoldBill()"
    (proceedToPay)="onProceedToPay()">
  </app-billing-mobile-cart-bar>

  <!-- Bottom Sheet Overlay -->
  <app-billing-cart-sheet
    *ngIf="isMobileCartOpen"
    [cartItems]="(cartItems$ | async) || []"
    [itemCount]="(itemCount$ | async) || 0"
    [subtotal]="(subtotal$ | async) || 0"
    [discount]="(discount$ | async) || 0"
    [total]="(total$ | async) || 0"
    [appliedOffer]="currentAppliedOffer"
    [customer]="(customer$ | async)"
    (close)="isMobileCartOpen = false"
    (updateQuantity)="onUpdateQuantity($event)"
    (remove)="onRemoveCartItem($event)"
    (clearCart)="onClearCart()"
    (openCustomer)="onOpenCustomer()"
    (openOffers)="onOpenOffers()"
    (holdBill)="onHoldBill()"
    (proceedToPay)="onProceedToPay()">
  </app-billing-cart-sheet>

  <app-billing-hold-bill-modal
    *ngIf="showHoldBillsModal"
    [heldBills]="(heldBills$ | async) || []"
    (resume)="onResumeHeldBill($event)"
    (delete)="onDeleteHeldBill($event)"
    (close)="showHoldBillsModal = false">
  </app-billing-hold-bill-modal>

  <app-billing-offer-modal
    *ngIf="showOfferModal"
    [currentAppliedOfferCode]="currentAppliedOfferCode"
    (close)="showOfferModal = false"
    (applyOffer)="onApplyOffer($event)">
  </app-billing-offer-modal>

  <app-billing-customer-modal
    *ngIf="showCustomerModal"
    (close)="showCustomerModal = false"
    (confirm)="onConfirmCustomer($event)">
  </app-billing-customer-modal>

</div>
