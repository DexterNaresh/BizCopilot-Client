<div class="history-container">
  <div class="header">
    <div class="title-row">
      <div class="icon-wrapper">
        <span class="material-symbols-outlined sparkles">auto_awesome</span>
      </div>
      <div class="title-col">
        <h2 class="title">AI Assistant</h2>
        <p class="subtitle">Your business copilot</p>
      </div>
    </div>
    <button class="new-chat-btn" (click)="onNewChat()">
      <span class="material-symbols-outlined">add</span>
      New Chat
    </button>
  </div>

  <div class="history-list">
    <div class="history-group" *ngFor="let group of historyGroups">
      <div class="group-title">{{ group.label }}</div>
      <button
        *ngFor="let item of group.items"
        class="history-item"
        [class.active]="item.id === activeId"
        (click)="onSelect(item.id)">
        <div class="item-left">
          <span class="material-symbols-outlined item-icon">{{ item.icon }}</span>
          <span class="truncate">{{ item.title }}</span>
        </div>
        <div class="item-right">
          <span class="time">{{ item.time }}</span>
          <span class="material-symbols-outlined chevron">chevron_right</span>
        </div>
      </button>
    </div>
  </div>
</div>
