<div class="home-container" *ngIf="loaded">
  
  <div class="home-banner-row">
    <app-home-banner></app-home-banner>
  </div>

  <div class="home-row-1">
    <div class="new-bill-wrapper">
      <app-home-new-bill (onNewBill)="navigateTo('billing')"></app-home-new-bill>
    </div>
    <div class="metrics-wrapper">
      <app-home-metrics
        [totalSales]="metrics.totalSales"
        [totalBills]="metrics.totalBills"
        [avgBill]="metrics.avgBill"
        [discountGiven]="metrics.discountGiven">
      </app-home-metrics>
    </div>
  </div>

  <div class="home-row-2">
    <app-home-quick-actions (onNavigate)="navigateTo($event)"></app-home-quick-actions>
  </div>

  <div class="home-row-3">
    <app-home-attention 
      [billsOnHold]="attention.billsOnHold"
      [productsUnavailable]="attention.productsUnavailable"
      (onNavigate)="navigateTo($event)">
    </app-home-attention>
    
    <app-home-activity 
      [recentBills]="recentBills"
      (onViewAll)="navigateTo('reports')">
    </app-home-activity>
    
    <app-home-ai-brief
      [metrics]="metrics"
      [attention]="attention">
    </app-home-ai-brief>
  </div>

  <div class="home-row-4">
    <app-home-status></app-home-status>
  </div>

</div>
