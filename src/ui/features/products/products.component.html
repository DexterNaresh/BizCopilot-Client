<div class="products-layout">
      <!-- Main Content Area -->
      <main class="main-content">
        <app-products-header (addProduct)="onAddProduct()"></app-products-header>
        
        <app-product-search 
          (search)="onSearch($event)" 
          (filter)="onOpenFilters()">
        </app-product-search>
        
        <app-products-filter 
          [activeFilter]="activeFilter"
          [totalCount]="totalProductsCount"
          [availableCount]="availableProductsCount"
          [unavailableCount]="unavailableProductsCount"
          [favouriteCount]="favouriteProductsCount"
          (filterChange)="onFilterChange($event)">
        </app-products-filter>
        
        <app-product-view-toggle
          [totalCount]="totalProducts"
          [viewMode]="viewMode"
          (viewModeChange)="onViewModeChange($event)">
        </app-product-view-toggle>

        <div class="product-content-area">
          <app-product-grid 
            *ngIf="viewMode === 'grid'"
            [products]="paginatedProducts"
            (edit)="onEditProduct($event)"
            (delete)="onArchiveProduct($event)"
            (toggleFavourite)="onToggleFavourite($event)"
            (toggleAvailability)="onToggleAvailability($event)">
          </app-product-grid>
          
          <app-product-table 
            *ngIf="viewMode === 'table'"
            [products]="paginatedProducts"
            (edit)="onEditProduct($event)"
            (delete)="onArchiveProduct($event)"
            (toggleFavourite)="onToggleFavourite($event)"
            (toggleAvailability)="onToggleAvailability($event)">
          </app-product-table>
        </div>

        <!-- Advanced Pagination -->
        <biz-pagination 
          [totalItems]="totalProducts"
          [pageSize]="pageSize"
          [currentPage]="currentPage"
          [pageSizeOptions]="[10, 20, 50, 100]"
          itemName="products"
          (pageChange)="onPageChange($event)"
          (pageSizeChange)="onPageSizeChange($event)">
        </biz-pagination>
      </main>

      <!-- Right Contextual Panel (Desktop Only) -->
      <aside class="right-rail">
        <app-product-support-panel 
          [products]="allProducts"
          (action)="onSupportAction($event)">
        </app-product-support-panel>
      </aside>

      <!-- Overlays -->
      <app-add-product-modal 
        *ngIf="showAddProductModal"
        [editProduct]="selectedProductForEdit"
        [categories]="allCategories"
        (close)="closeModals()"
        (save)="onSaveProduct($event)">
      </app-add-product-modal>

      <app-add-category-modal
        *ngIf="showAddCategoryModal"
        [editCategory]="null"
        (close)="closeModals()"
        (save)="onSaveCategory($event)">
      </app-add-category-modal>

      <biz-filter-sheet *ngIf="showFiltersSheet" title="Product Filters" (closeSheet)="closeModals()">
        <app-products-filter 
          [activeFilter]="activeFilter"
          [totalCount]="totalProductsCount"
          [availableCount]="availableProductsCount"
          [unavailableCount]="unavailableProductsCount"
          [favouriteCount]="favouriteProductsCount"
          (filterChange)="onFilterChange($event); closeModals()">
        </app-products-filter>
      </biz-filter-sheet>
    </div>
