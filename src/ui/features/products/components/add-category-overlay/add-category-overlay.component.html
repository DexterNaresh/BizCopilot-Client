<div class="overlay-backdrop" (click)="onCancel()">
  <div class="overlay-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Add New Category</h2>
      <button class="icon-btn close-btn" (click)="onCancel()">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>

    <div class="modal-body">
      <div class="error-alert" *ngIf="error">
        <span class="material-symbols-rounded">error</span>
        {{error}}
      </div>

      <div class="form-group">
        <label>Category Name <span class="required">*</span></label>
        <input 
          type="text" 
          class="form-control" 
          [(ngModel)]="formData.name" 
          placeholder="e.g. Beverages"
          [class.is-invalid]="error && !formData.name.trim()">
      </div>

      <div class="form-group">
        <label>Icon</label>
        <div class="icon-selector">
          <span class="material-symbols-rounded selected-icon">{{formData.icon}}</span>
          <!-- In a full implementation, this would open an icon picker -->
          <input 
            type="text" 
            class="form-control" 
            [(ngModel)]="formData.icon" 
            placeholder="Material Symbol Name (e.g. category)">
        </div>
      </div>

      <div class="form-group">
        <label>Description (Optional)</label>
        <textarea 
          class="form-control" 
          [(ngModel)]="formData.description" 
          placeholder="Brief description of products in this category"
          rows="3"></textarea>
      </div>

      <div class="form-group">
        <label>Status</label>
        <select class="form-control" [(ngModel)]="formData.status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="onCancel()" [disabled]="isSaving">Cancel</button>
      <button class="btn-primary" (click)="onSave()" [disabled]="isSaving">
        <span class="spinner" *ngIf="isSaving"></span>
        {{isSaving ? 'Saving...' : 'Save Category'}}
      </button>
    </div>
  </div>
</div>
