<div class="product-grid">
      <app-product-card 
        *ngFor="let product of products" 
        [product]="product"
        (edit)="edit.emit($event)"
        (delete)="delete.emit($event)"
        (toggleFavourite)="toggleFavourite.emit($event)"
        (toggleAvailability)="toggleAvailability.emit($event)">
      </app-product-card>
    </div>
