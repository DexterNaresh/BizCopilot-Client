<div class="overlay-backdrop" (click)="onCancel()">
  <div class="overlay-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Add New Product</h2>
      <button class="icon-btn close-btn" (click)="onCancel()">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>

    <div class="modal-body">
      <div class="error-alert" *ngIf="error">
        <span class="material-symbols-rounded">error</span>
        {{error}}
      </div>

      <div class="form-row">
        <!-- Image Upload Mock -->
        <div class="image-upload-area">
          <div class="upload-placeholder">
            <span class="material-symbols-rounded">photo_camera</span>
            <p>Add Image</p>
          </div>
        </div>

        <div class="flex-column flex-1">
          <div class="form-group">
            <label>Product Name <span class="required">*</span></label>
            <input 
              type="text" 
              class="form-control" 
              [(ngModel)]="formData.name" 
              placeholder="e.g. Cappuccino"
              [class.is-invalid]="error && !formData.name.trim()">
          </div>

          <div class="form-group">
            <label>Category <span class="required">*</span></label>
            <div class="category-select-wrapper">
              <select class="form-control" [(ngModel)]="formData.categoryId" [class.is-invalid]="error && !formData.categoryId">
                <option value="" disabled selected>Select Category</option>
                <option *ngFor="let cat of facade.categories()" [value]="cat.id">{{cat.name}}</option>
              </select>
              <button class="icon-btn text-primary inline-add-btn" (click)="openAddCategory()" title="Create New Category">
                <span class="material-symbols-rounded">add_circle</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label>Selling Price <span class="required">*</span></label>
          <div class="input-with-prefix">
            <span class="prefix">₹</span>
            <input type="number" class="form-control" [(ngModel)]="formData.sellingPrice" min="0">
          </div>
        </div>
        <div class="form-group flex-1">
          <label>Unit <span class="required">*</span></label>
          <select class="form-control" [(ngModel)]="formData.unit">
            <option value="Piece">Piece</option>
            <option value="Cup">Cup</option>
            <option value="Glass">Glass</option>
            <option value="Slice">Slice</option>
            <option value="Plate">Plate</option>
            <option value="Kg">Kg</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group flex-1">
          <label>Barcode (Optional)</label>
          <div class="input-with-icon">
            <input type="text" class="form-control" [(ngModel)]="formData.barcode" placeholder="Scan or type">
            <span class="material-symbols-rounded suffix-icon">barcode_scanner</span>
          </div>
        </div>
        <div class="form-group flex-1">
          <label>Availability</label>
          <select class="form-control" [(ngModel)]="formData.availability">
            <option value="available">Available</option>
            <option value="unavailable">Unavailable</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Description (Optional)</label>
        <textarea 
          class="form-control" 
          [(ngModel)]="formData.description" 
          placeholder="Product details..."
          rows="2"></textarea>
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn-secondary" (click)="onCancel()" [disabled]="isSaving">Cancel</button>
      <button class="btn-primary" (click)="onSave()" [disabled]="isSaving">
        <span class="spinner" *ngIf="isSaving"></span>
        {{isSaving ? 'Saving...' : 'Save Product'}}
      </button>
    </div>
  </div>
</div>

<app-add-category-overlay *ngIf="isAddCategoryOpen" (close)="closeAddCategory()"></app-add-category-overlay>
