<div class="product-card" [class.unavailable]="product.availability === 'unavailable'">
  <div class="image-container">
    <ng-container *ngIf="product.image; else imagePlaceholder">
      <img [src]="product.image" [alt]="product.name">
    </ng-container>
    <ng-template #imagePlaceholder>
      <div class="image-placeholder">
        <span class="material-symbols-rounded">photo_camera</span>
      </div>
    </ng-template>
    
    <!-- Direct Actions Overlay -->
    <div class="card-actions-overlay">
      <button class="icon-btn action-btn edit-btn" (click)="onEdit($event)">
        <span class="material-symbols-rounded">edit</span>
      </button>
      <button class="icon-btn action-btn delete-btn" (click)="onDelete($event)">
        <span class="material-symbols-rounded">delete_outline</span>
      </button>
    </div>
  </div>

  <div class="info-container">
    <!-- Row 1: Category & Favourite -->
    <div class="info-row metadata-row">
      <span class="category-name">{{product.categoryName}}</span>
      <button class="icon-btn fav-btn" [class.active]="product.favourite" (click)="onToggleFavourite($event)">
        <span class="material-symbols-rounded">{{product.favourite ? 'star' : 'star_outline'}}</span>
      </button>
    </div>

    <!-- Row 2: Name -->
    <div class="info-row name-row">
      <h3>{{product.name}}</h3>
    </div>

    <!-- Row 3: Price & Availability Toggle -->
    <div class="info-row price-action-row">
      <span class="price">₹{{product.sellingPrice | number:'1.2-2'}}</span>
      
      <label class="availability-toggle">
        <input type="checkbox" [checked]="product.availability === 'available'" (change)="onToggleAvailability($event)">
        <span class="toggle-slider"></span>
        <span class="sr-only">Toggle Availability</span>
      </label>
    </div>
  </div>
</div>
