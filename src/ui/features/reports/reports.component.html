<div class="report-page-container">
  <app-reports-header></app-reports-header>
  
  <app-reports-controls
    [selectedPeriod]="selectedPeriod"
    [activeFilterCount]="activeFilterCount"
    (periodChange)="onPeriodChange($event)"
    (filterApply)="onFilterApply($event)"
    (filterClear)="onFilterClear()">
  </app-reports-controls>
  
  <app-reports-kpi [data]="kpiData"></app-reports-kpi>
  
  <div class="trend-payment-grid">
    <div class="trend-section">
      <app-reports-sales-trend
        [subtitle]="trendSubtitle"
        [rawData]="trendRawData">
      </app-reports-sales-trend>
    </div>
    <div class="payment-section">
      <app-reports-payment-methods
        [totalSales]="kpiData.totalSales"
        [paymentMethods]="paymentMethodsData">
      </app-reports-payment-methods>
    </div>
  </div>
  
  <div class="insights-grid">
    <div class="top-products-section">
      <app-reports-top-products></app-reports-top-products>
    </div>
    <div class="offers-section">
      <app-reports-offers></app-reports-offers>
    </div>
  </div>
  
  <div class="details-section">
    <app-reports-sales-details
      [allRecords]="filteredRecords"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)">
    </app-reports-sales-details>
  </div>
</div>
